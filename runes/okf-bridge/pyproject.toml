[project]
name = "okf-bridge"
version = "0.2.0"
description = "Official Open Knowledge Format (OKF v0.2) and MADR 3.0 knowledge bridge for MvgeOS"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvgeos_runes_okf_bridge/",
    "rune.py",
    "cli.py",
]

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]
