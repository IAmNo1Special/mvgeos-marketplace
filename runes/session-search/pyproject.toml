[project]
name = "mvgeos-runes-session-search"
version = "0.1.0"
description = "Full-text BM25 search over MvgeOS sessions (Tome v1, Pi, Antigravity transcripts)"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvgeos_runes_session_search/",
    "rune.py",
]

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]
