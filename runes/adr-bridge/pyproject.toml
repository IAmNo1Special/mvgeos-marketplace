[project]
name = "adr-bridge"
version = "0.1.0"
description = "Official Markdown Architectural Decision Records (MADR 3.0) bridge for MvgeOS"
requires-python = ">=3.13"
dependencies = [
    "pyyaml>=6.0",
    "typer>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = [
    "mvgeos_runes_adr_bridge/",
    "rune.py",
    "cli.py",
]

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]
