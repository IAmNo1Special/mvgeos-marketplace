[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mvgeos-runes-heal-my-goap"
version = "0.1.0"
description = "Zero-token GOAP planning & LLM-powered self-healing Rune for MvgeOS"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "goapauto>=0.3.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "psutil>=6.0.0",
    "python-dotenv>=1.2.2",
]

[tool.hatch.build.targets.wheel]
packages = ["mvgeos_runes_heal_my_goap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 80
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
files = ["mvgeos_runes_heal_my_goap", "tests", "rune.py"]

# ---------------------------------------------------------------------------
# Automated Changelog — git-cliff
# Run: uvx git-cliff --output CHANGELOG.md
# Uses Conventional Commits (feat:, fix:, chore:, docs:, etc.)
# ---------------------------------------------------------------------------
[tool.git-cliff.changelog]
header = """
# Changelog

All notable changes to `heal-my-goap` are documented here.
"""
