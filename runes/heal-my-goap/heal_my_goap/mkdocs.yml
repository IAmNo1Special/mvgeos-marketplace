site_name: heal-my-goap
site_url: https://IAmNo1Special.github.io/heal_my_goap/
site_description: Production-grade zero-token symbolic GOAP planning with LLM-powered self-healing via OpenRouter.
site_author: Antigravity Team
repo_url: https://github.com/IAmNo1Special/heal_my_goap
repo_name: IAmNo1Special/heal_my_goap

theme:
  name: material
  palette:
    # Default Dark Mode (Slate)
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Optional Light Mode toggle
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
    logo: material/medical-bag

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink
  - pymdownx.mark
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde
  - toc:
      permalink: true
      toc_depth: 3

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - Installation: getting-started/installation.md
      - Core Concepts: getting-started/concepts.md
  - User Guide:
      - user-guide/index.md
      - Tool Registration: user-guide/tool-ingestion.md
      - Runtime Delta Observer: user-guide/delta-observer.md
      - LLM Self-Healing: user-guide/self-healing.md
  - Examples:
      - examples/index.md
      - OS System Monitor: examples/system-monitor.md
      - Autonomous Coding Agent: examples/coding-agent.md
      - Hospital Medic Robot: examples/hospital-emergency.md
      - Google ADK Integration: examples/google-adk-integration.md
  - API Reference:
      - api-reference/index.md
      - GoapEngine: api-reference/engine.md
      - Models & Helpers: api-reference/models.md
      - DeltaObserver: api-reference/observer.md
      - SystemSensors: api-reference/sensors.md
      - Synthesizer & GapAnalyzer: api-reference/synthesizer.md