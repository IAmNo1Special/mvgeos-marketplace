[project]
name = "mvgeos-marketplace"
version = "0.1.0"
description = "Official MvgeOS extension marketplace"
requires-python = ">=3.13"
dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "aiohttp>=3.9",
    "httpx>=0.27",
    "mcp>=2.2.0",
    "opentelemetry-api>=1.30.0",
    "opentelemetry-sdk>=1.30.0",
    "pyyaml>=6.0",
    "typer>=0.12",
]

[tool.pytest.ini_options]
testpaths = [
    "runes/openrouter-realm/tests",
    "runes/seeker/tests",
    "runes/heal-my-goap/tests",
    "runes/mcp-bridge/tests",
    "runes/opentelemetry-bridge/tests",
    "runes/okf-bridge/tests",
    "runes/adr-bridge/tests",
    "runes/pi-bridge/tests",
    "runes/skills-bridge/tests",
    "runes/steering-bridge/tests",
]
python_files = "*.py"
pythonpath = [
    "runes/openrouter-realm",
    "runes/seeker",
    "runes/heal-my-goap",
    "runes/mcp-bridge",
    "runes/opentelemetry-bridge",
    "runes/okf-bridge",
    "runes/adr-bridge",
    "runes/pi-bridge",
    "runes/skills-bridge",
    "runes/steering-bridge",
]
addopts = "--import-mode=importlib"

[tool.coverage.run]
branch = true
omit = [
    "*/temp/*",
    "*/tmp*/**",
    "*/AppData/Local/Temp/**",
]

[tool.uv.sources]
mvgeos-core = { path = "../mvgeos/mvgeos-core", editable = true }
mvgeos-runes = { path = "../mvgeos/mvgeos-runes", editable = true }
mvgeos-provider = { path = "../mvgeos/mvgeos-provider", editable = true }
mvgeos-agent = { path = "../mvgeos/mvgeos-agent", editable = true }

[dependency-groups]
dev = [
    "mvgeos-agent",
    "mvgeos-core",
    "mvgeos-provider",
    "mvgeos-runes",
    "mypy>=2.3.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]
